name: Bug Report
description: Report a bug or unexpected behavior in the A/B Testing Decision Engine.
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. Please provide enough information to reproduce it.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Clearly explain the problem.
      placeholder: Describe what happened...
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: List the steps required to reproduce the issue.
      placeholder: |
        1. Run...
        2. Enter...
        3. Observe...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What happened instead?
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python Version
      placeholder: "e.g. Python 3.12"

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, dependency versions, and relevant configuration.
    validations:
      required: false
